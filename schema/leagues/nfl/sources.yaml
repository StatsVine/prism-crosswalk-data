---
players:
  - espn:
    name: ESPN
    id_field: espn_id
    active: true
    required: false
    stable: true
    pattern: ^\d{1,8}$
  - gsis:
    name: NFL GSIS (Game Stats and Info Service)
    id_field: gsis_id
    active: true
    # Not usually updated with rookies until August-ish?
    required: false
    stable: true
    pattern: ^00\-\d{7}$
  - nffc:
    name: National Fantasy Football Championship
    id_field: nffc_id
    active: true
    required: false
    stable: true
    pattern: ^\d{1,8}$
  - pfr:
    name: Pro Football Reference
    id_field: pfr_id
    active: true
    required: false
    stable: false
    pattern: ^[A-Za-z.'_\-]{5,8}\d{1,3}$
    note: >-
      Derived from the player's name, so it is neither uniform nor permanent. Two
      families exist -- the usual mixed-case form (MahoPa00), and a lowercase form
      used for kickers and punters (gouldrob01). Names contribute apostrophes,
      hyphens and underscores (Sua-Xa00, Cox_Mi20), and the numeric suffix widens
      when it has to disambiguate common names (WillJo011).
  - sleeper:
    name: Sleeper Fantasy
    id_field: sleeper_id
    active: true
    required: false
    stable: true
    pattern: ^\d{1,8}$
  - sportradar:
    name: Sportradar
    id_field: sportradar_id
    active: true
    required: false
    stable: true
    # uuid, lowercased
    pattern: ^[0-9a-f]{8}\-[0-9a-f]{4}\-[0-9a-f]{4}\-[0-9a-f]{4}\-[0-9a-f]{12}$
  - wikidata:
    name: Wikidata
    id_field: wikidata_id
    active: true
    required: false
    stable: true
    pattern: ^Q[1-9]\d{0,9}$
  - yahoo:
    name: Yahoo Fantasy
    id_field: yahoo_id
    active: true
    required: false
    stable: true
    pattern: ^\d{1,8}$
