name: Check ffb_ids Ids

on:
  workflow_dispatch:  # manually triggered
  schedule:
    # Weekly, not daily -- ffb_ids is refreshed by hand roughly once a year.
    - cron: '5 14 * * 1'  # Mondays at 14:05 UTC (Pacific morning)

permissions:
  contents: read
  issues: write

jobs:
  check_ffb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout crosswalk-data repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Clone prism-tools
        run: |
          git clone https://github.com/statsvine/prism-tools.git tools

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt || true

      - name: Run ffb_ids check script
        id: run-script
        run: |
          python tools/crosswalk/nfl/validate_ffb_ids.py data/nfl/players.csv --issues ffb_issues.md --ignores-file .validation/ignore_ffb.yaml
          if [ -f ffb_issues.md ]; then
            echo "issues_file_found=1" >> $GITHUB_ENV
          fi

      - name: Find the last open report issue
        if: env.issues_file_found == '1'
        id: last-issue
        uses: micalevisk/last-issue-action@v2
        with:
          state: open
          labels: |
            nfl
            source-ffb-ids
            roster-gap

      - name: Create GitHub Issue
        if: env.issues_file_found == '1'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "📃 ffb_ids ID differences detected"
          content-filepath: ./ffb_issues.md
          issue-number: ${{ steps.last-issue.outputs.issue-number }}
          labels: nfl, source-ffb-ids, roster-gap
