name: Check FantasyPros Ids

on:
  workflow_dispatch:  # manually triggered
  schedule:
    # Daily, reading the git-scraped snapshot in statsvine/data-snapshots
    # rather than FantasyPros directly -- the same arrangement as check_sleeper.
    # Offset from the other NFL checks so they do not all contend for a window.
    - cron: '5 14 * * *'  # 14:05 UTC

permissions:
  contents: read
  issues: write

jobs:
  check_fantasypros:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout crosswalk-data repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Clone prism-tools
        run: |
          git clone https://github.com/statsvine/prism-tools.git tools

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt || true

      - name: Run FantasyPros check script
        id: run-script
        run: |
          python tools/crosswalk/nfl/validate_fantasypros_ids.py data/nfl/players.csv --issues fantasypros_issues.md --ignores-file .validation/ignore_fantasypros.yaml
          if [ -f fantasypros_issues.md ]; then
            echo "issues_file_found=1" >> $GITHUB_ENV
          fi

      - name: Find the last open report issue
        if: env.issues_file_found == '1'
        id: last-issue
        uses: micalevisk/last-issue-action@v2
        with:
          state: open
          labels: |
            nfl
            source-fantasypros
            roster-gap

      - name: Create GitHub Issue
        if: env.issues_file_found == '1'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "📃 FantasyPros ID differences detected"
          content-filepath: ./fantasypros_issues.md
          issue-number: ${{ steps.last-issue.outputs.issue-number }}
          labels: nfl, source-fantasypros, roster-gap
