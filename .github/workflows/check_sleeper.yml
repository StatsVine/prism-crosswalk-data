name: Check Sleeper Ids

on:
  workflow_dispatch:  # manually triggered
  schedule:
    - cron: '55 13 * * *'  # every day at 13:55 UTC (Pacific morning)

permissions:
  contents: read
  issues: write

jobs:
  check_sleeper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout crosswalk-data repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Clone prism-tools
        run: |
          git clone https://github.com/statsvine/prism-tools.git tools

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt || true

      - name: Run Sleeper check script
        id: run-script
        run: |
          python tools/crosswalk/nfl/validate_sleeper_ids.py data/nfl/players.csv --issues sleeper_issues.md --ignores-file .validation/ignore_sleeper.yaml
          if [ -f sleeper_issues.md ]; then
            echo "issues_file_found=1" >> $GITHUB_ENV
          fi

      - name: Find the last open report issue
        if: env.issues_file_found == '1'
        id: last-issue
        uses: micalevisk/last-issue-action@v2
        with:
          state: open
          labels: |
            nfl
            source-sleeper
            roster-gap

      - name: Create GitHub Issue
        if: env.issues_file_found == '1'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: "📃 Sleeper ID differences detected"
          content-filepath: ./sleeper_issues.md
          issue-number: ${{ steps.last-issue.outputs.issue-number }}
          labels: nfl, source-sleeper, roster-gap
