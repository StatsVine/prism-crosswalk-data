name: Validate CSV data

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Clone prism-tools
        run: |
          git clone https://github.com/statsvine/prism-tools.git tools
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt || true

      - name: Run CSV validation on MLB players
        run: |
          python3 tools/crosswalk/validate_players.py --csv data/mlb/players.csv --core-schema schema/players.yaml --source-schema schema/leagues/mlb/sources.yaml --fail-fast

      - name: Run CSV validation on NFL players
        run: |
          python3 tools/crosswalk/validate_players.py --csv data/nfl/players.csv --core-schema schema/players.yaml --source-schema schema/leagues/nfl/sources.yaml --fail-fast

      # Per-league validation only checks uniqueness within its own file, so
      # check across every data/*/players.csv here. Discovers new leagues on its own.
      - name: Check prism_id global uniqueness
        run: |
          python3 tools/crosswalk/check_global_prism_ids.py