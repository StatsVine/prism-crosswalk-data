---
# Known Sleeper discrepancies to suppress, keyed by prism_id.
# Each entry is a list of our field names to skip for that player, with a
# comment explaining why.
#
# Sleeper is first-hand for sleeper_id, so a mismatch there is almost always
# ours to fix rather than to suppress. The borrowed ids (espn, gsis, sportradar,
# yahoo) are the ones that drift.
#
# 3zszjj1jwd: # Doe, John
#   - espn_id # Wrong espn id in Sleeper
bprsm7p7sr: # Conklin, Tyler
  - espn_id # Sleeper swaps espn/gsis with Ryan Izzo (5094); 3915486 is Conklin
  - gsis_id # Same swap; nflverse and DynastyProcess have 00-0034270 for Conklin
  - yahoo_id # Sleeper has Izzo's 31220; Yahoo's own page has 31127 for Conklin
